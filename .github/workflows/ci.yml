name: Continuous Integration & Verification

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pinnacle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Code Style & ESLint
        run: pnpm lint

      - name: TypeScript Type Checking
        run: pnpm type-check

      - name: Database Migration & Schema Validation
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pinnacle_test?schema=public
        run: |
          cd backend
          npx prisma generate
          npx prisma migrate deploy

      - name: Execute Full Test Suite (Unit + Integration)
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pinnacle_test?schema=public
          JWT_SECRET: test_jwt_secret_min_32_characters_long_entropy
          ENCRYPTION_SECRET: test_aes_secret_key_minimum_32_chars_ok
          TAX_RATE_PERCENT: 15
          CURRENCY: NZD
          PAYMENT_DEFAULT_PROVIDER: MOCK
          TRANSACTIONAL_EMAIL_PROVIDER: MOCK
        run: pnpm --filter @pinnacle/api test

      - name: Verify Production Next.js Build
        env:
          NODE_ENV: production
          NEXT_STANDALONE: 'false'
        run: pnpm --filter @pinnacle/web build

      - name: Verify Production NestJS API Build
        env:
          NODE_ENV: production
        run: pnpm --filter @pinnacle/api build

      - name: Dependency Security Audit
        run: pnpm audit --prod --audit-level=high

